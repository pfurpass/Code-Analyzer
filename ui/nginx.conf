server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent nginx from generating absolute redirects that strip the original port.
    # Without this: request to localhost:8080/results → redirect to http://localhost/results/
    # (port 80 instead of 8080) → browser blocks it as CORS violation.
    absolute_redirect off;

    # Allow large ZIP uploads — set at server level before any location blocks
    client_max_body_size 500M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── API proxy — all backend routes ──────────────────────────────────────

    location /scan/ {
        proxy_pass         http://api:3000/scan/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /results/ {
        proxy_pass         http://api:3000/results/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass       http://api:3000/health;
        proxy_http_version 1.1;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
