rules:
  # ── Hardcoded Secrets ────────────────────────────────────────────────────

  - id: hardcoded-password
    patterns:
      - pattern-either:
          - pattern: $X = "..."
          - pattern: $X = '...'
    pattern-regex: '(?i)(password|passwd|pwd|secret|token|api_key|apikey|auth_token)\s*=\s*["\'][^"\']{4,}["\']'
    message: "Hardcoded credential detected in variable '$X'. Use environment variables instead."
    severity: ERROR
    languages: [python, javascript, typescript]
    metadata:
      category: security
      cwe: ["CWE-798"]
      owasp: ["A07:2021"]

  - id: hardcoded-aws-key
    pattern-regex: '(?i)(AKIA[0-9A-Z]{16})'
    message: "Hardcoded AWS Access Key detected. Rotate immediately."
    severity: ERROR
    languages: [python, javascript, typescript, generic]
    metadata:
      category: security
      cwe: ["CWE-798"]

  - id: hardcoded-jwt-secret
    patterns:
      - pattern-either:
          - pattern: jwt.sign($PAYLOAD, "$SECRET", ...)
          - pattern: jwt.verify($TOKEN, "$SECRET", ...)
    message: "Hardcoded JWT secret. Use environment variables: process.env.JWT_SECRET"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: ["CWE-798"]
      owasp: ["A02:2021"]

  # ── Injection Vulnerabilities ────────────────────────────────────────────

  - id: sql-injection-string-concat
    patterns:
      - pattern-either:
          - pattern: |
              $DB.query("..." + $INPUT)
          - pattern: |
              $DB.query(`...${$INPUT}...`)
          - pattern: |
              cursor.execute("..." + $INPUT)
    message: "Potential SQL injection via string concatenation. Use parameterized queries."
    severity: ERROR
    languages: [javascript, typescript, python]
    metadata:
      category: security
      cwe: ["CWE-89"]
      owasp: ["A03:2021"]

  - id: command-injection-exec
    patterns:
      - pattern-either:
          - pattern: exec($CMD + $INPUT)
          - pattern: execSync($CMD + $INPUT)
          - pattern: spawn($CMD + $INPUT)
          - pattern: subprocess.call($CMD + $INPUT, shell=True)
          - pattern: subprocess.run($CMD + $INPUT, shell=True)
          - pattern: os.system($CMD)
    message: "Potential command injection. Avoid using user input in shell commands."
    severity: ERROR
    languages: [javascript, typescript, python]
    metadata:
      category: security
      cwe: ["CWE-78"]
      owasp: ["A03:2021"]

  - id: path-traversal
    patterns:
      - pattern-either:
          - pattern: fs.readFile($BASE + req.$PARAM, ...)
          - pattern: fs.readFileSync($BASE + req.$PARAM, ...)
          - pattern: open($BASE + request.$PARAM)
    message: "Potential path traversal vulnerability. Sanitize and validate file paths."
    severity: ERROR
    languages: [javascript, typescript, python]
    metadata:
      category: security
      cwe: ["CWE-22"]
      owasp: ["A01:2021"]

  # ── Unsafe Patterns ───────────────────────────────────────────────────────

  - id: unsafe-eval
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function($X)
    message: "Use of eval() is dangerous and allows code injection."
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: ["CWE-95"]

  - id: python-pickle-unsafe
    patterns:
      - pattern-either:
          - pattern: pickle.loads($DATA)
          - pattern: pickle.load($FILE)
          - pattern: cPickle.loads($DATA)
    message: "Unpickling untrusted data can lead to arbitrary code execution."
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cwe: ["CWE-502"]

  - id: python-yaml-unsafe-load
    pattern: yaml.load($DATA, ...)
    pattern-not: yaml.safe_load($DATA)
    message: "yaml.load() is unsafe. Use yaml.safe_load() instead."
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      cwe: ["CWE-502"]

  - id: weak-crypto-md5
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("md5")
          - pattern: hashlib.md5(...)
          - pattern: MD5.new(...)
    message: "MD5 is cryptographically weak. Use SHA-256 or stronger."
    severity: WARNING
    languages: [javascript, typescript, python]
    metadata:
      category: security
      cwe: ["CWE-327"]

  - id: weak-crypto-sha1
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("sha1")
          - pattern: hashlib.sha1(...)
    message: "SHA-1 is cryptographically weak for security purposes. Use SHA-256 or stronger."
    severity: WARNING
    languages: [javascript, typescript, python]
    metadata:
      category: security
      cwe: ["CWE-327"]

  - id: insecure-random
    patterns:
      - pattern-either:
          - pattern: Math.random()
          - pattern: random.random()
          - pattern: random.randint(...)
    message: "Math.random()/random is not cryptographically secure. Use crypto.randomBytes() or secrets module."
    severity: WARNING
    languages: [javascript, typescript, python]
    metadata:
      category: security
      cwe: ["CWE-338"]

  - id: cors-wildcard
    patterns:
      - pattern-either:
          - pattern: res.header("Access-Control-Allow-Origin", "*")
          - pattern: app.use(cors())
    message: "Overly permissive CORS policy detected. Restrict allowed origins."
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: ["CWE-942"]

  - id: disable-ssl-verify
    patterns:
      - pattern-either:
          - pattern: requests.get(..., verify=False, ...)
          - pattern: requests.post(..., verify=False, ...)
          - pattern: ssl._create_unverified_context()
    message: "SSL verification is disabled. This exposes the application to MITM attacks."
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cwe: ["CWE-295"]
